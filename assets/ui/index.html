<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>QGen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <button id="btn-back" class="icon-btn" aria-label="返回" hidden>&#x2190;</button>
    <div id="title-wrap">
      <div id="title">QGen</div>
      <div id="subtitle">QSP 游戏编辑器</div>
    </div>
    <button id="btn-find" class="icon-btn" aria-label="查找" hidden>&#x1F50D;</button>
    <button id="btn-menu" class="icon-btn" aria-label="菜单" hidden>&#x22EE;</button>
  </header>

  <!-- 首页：未打开文件 -->
  <section id="screen-home" class="screen">
    <div class="home-hero">
      <div class="logo">Q</div>
      <h1>QGen <span class="ver">Android</span></h1>
      <p class="muted">QSP 游戏编辑器 · 读取与编辑 .qsp 文件</p>
    </div>
    <div class="home-actions">
      <button class="big-btn primary" id="btn-open">
        <span class="big-ico">&#x1F4C2;</span>
        <span><b>打开 .qsp 文件</b><small>从“下载 / 文档 / 任意位置”选择</small></span>
      </button>
      <button class="big-btn" id="btn-new">
        <span class="big-ico">&#x2795;</span>
        <span><b>新建空游戏</b><small>从一个 Start 位置开始</small></span>
      </button>
      <button class="big-btn" id="btn-import-zip">
        <span class="big-ico">&#x1F4E5;</span>
        <span><b>导入 TXT 工程（.zip）</b><small>把拆分后的 TXT 包还原为 .qsp</small></span>
      </button>
    </div>
    <div class="section-title" id="recent-title" hidden>最近打开</div>
    <div id="recent-list" class="recent-list"></div>
    <div class="dev-box" id="dev-box" hidden>
      <div class="section-title">示例 / 测试文件（应用私有目录）</div>
      <div id="dev-list" class="recent-list"></div>
    </div>
    <div class="home-foot">
      <span>QGen Android <span id="ver-text">1.3.7</span> · 基于 QGen 4.3 格式</span>
      <a href="#" id="link-about">关于 / 许可</a>
    </div>
  </section>

  <!-- 位置列表 -->
  <section id="screen-list" class="screen" hidden>
    <div class="search-bar">
      <span class="search-ico">&#x1F50D;</span>
      <input id="search" type="search" placeholder="搜索位置名、代码…" autocomplete="off">
      <button id="search-clear" class="mini-btn" hidden>✕</button>
    </div>
    <div class="list-meta">
      <span id="list-count">0 个位置</span>
      <button id="btn-add-loc" class="text-btn">＋ 新建位置</button>
    </div>
    <div id="loc-list" class="loc-list"></div>
    <div id="list-empty" class="empty" hidden>没有匹配的位置</div>
  </section>

  <!-- 编辑器：点开位置直接进入代码页 -->
  <section id="screen-editor" class="screen" hidden>
    <div id="pane-code" class="pane">
      <div id="findbar" class="findbar" hidden>
        <input id="find-input" type="search" placeholder="在当前位置代码中查找…" autocomplete="off" autocapitalize="off">
        <span id="find-count" class="find-count">0/0</span>
        <button id="find-prev" class="find-btn" aria-label="上一个">&#x2191;</button>
        <button id="find-next" class="find-btn" aria-label="下一个">&#x2193;</button>
        <button id="find-close" class="find-btn" aria-label="关闭">&#x2715;</button>
      </div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter-code"></div>
        <div class="code-area">
          <pre class="hl" id="hl-code" aria-hidden="true" hidden><code id="hl-code-body"></code></pre>
          <textarea id="edit-code" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="位置代码（进入该位置时执行）"></textarea>
        </div>
      </div>
    </div>

    <div class="editor-foot">
      <span id="editor-info"></span>
      <span class="foot-right">
        <button id="btn-zoom-out" class="foot-btn" aria-label="缩小字号">A−</button>
        <button id="btn-zoom-in" class="foot-btn" aria-label="放大字号">A+</button>
        <button id="btn-hl" class="foot-btn" title="语法高亮">高亮</button>
        <button id="btn-lh" class="foot-btn" title="行距">行距</button>
        <button id="btn-wrap" class="foot-btn" title="自动换行">换行</button>
        <span id="dirty-flag" class="dirty" hidden>● 未保存</span>
      </span>
    </div>
  </section>

</div>

<!-- 底部弹层容器 -->
<div id="sheet-host" class="sheet-host" hidden>
  <div class="sheet-mask" id="sheet-mask"></div>
  <div class="sheet" id="sheet"></div>
</div>

<!-- 模态框 -->
<div id="modal-host" class="modal-host" hidden>
  <div class="modal-mask"></div>
  <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="qsp.js"></script>
<script src="syntax.js"></script>
<script src="zip.js"></script>
<script src="qsp-text.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
